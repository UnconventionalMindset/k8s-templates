apiVersion: v1
kind: PersistentVolume
metadata:
  name: guaca-config-nfs
spec:
  capacity:
    storage: 1070Gi
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  mountOptions:
    - hard
    - nfsvers=4.2
    - rsize=1048576
    - wsize=1048576
    - noatime
  nfs:
    server: 192.168.31.99
    path: "/mnt/ssd120/apps/guaca"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guaca-config-nfs
  namespace: guaca
spec:
  volumeName: guaca-config-nfs
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      # minimum capacity
      storage: 100Mi
