# Uptime Kuma IngressRoute for Traefik
# Change the host to your domain

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`uptime.umhomelab.com`) || Host(`www.uptime.umhomelab.com`)
      kind: Rule
      # Uncomment to require Authentik authentication:
      # middlewares:
      #   - name: authentik
      #     namespace: auth
      services:
        - name: uptime-kuma
          namespace: uptime-kuma
          port: 3001
  tls: {}
