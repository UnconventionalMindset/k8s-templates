apiVersion: v1
kind: Service
metadata:
  name: truenas
  namespace: default
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas
  namespace: default
  labels:
    kubernetes.io/service-name: truenas
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.31.99
ports:
  - name: https
    port: 443
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nas.umhomelab.com`) || Host(`www.nas.umhomelab.com`)
      kind: Rule
      services:
        - name: truenas
          namespace: default
          port: 443
          scheme: https
          serversTransport: skip-ssl
  tls: {}
