apiVersion: v1
kind: Service
metadata:
  name: proxmox-hs
  namespace: default
spec:
  ports:
    - name: http
      port: 443
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox-hs
  namespace: default
  labels:
    kubernetes.io/service-name: proxmox-hs
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.31.84
ports:
  - name: http
    port: 8006
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox-hs
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hs.umhomelab.com`) || Host(`www.hs.umhomelab.com`)
      kind: Rule
      services:
        - name: proxmox-hs
          namespace: default
          port: 443
          scheme: https
          serversTransport: skip-ssl
  tls: {}
