apiVersion: v1
kind: Service
metadata:
  name: proxmox-e2
  namespace: default
spec:
  ports:
    - name: http
      port: 443
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox-e2
  namespace: default
  labels:
    kubernetes.io/service-name: proxmox-e2
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.31.86
ports:
  - name: http
    port: 8006
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox-e2
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`e2.umhomelab.com`) || Host(`www.e2.umhomelab.com`)
      kind: Rule
      services:
      - name: proxmox-e2
        namespace: default
        port: 443
        scheme: https
        serversTransport: skip-ssl
  tls: {}
