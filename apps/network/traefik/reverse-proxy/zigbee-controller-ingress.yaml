apiVersion: v1
kind: Service
metadata:
  name: zb
  namespace: default
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: zb
  namespace: default
  labels:
    kubernetes.io/service-name: zb
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.31.77
ports:
  - name: http
    port: 80
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zb
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`zb.umhomelab.com`) || Host(`www.zb.umhomelab.com`)
      kind: Rule
      services:
        - name: zb
          namespace: default
          port: 80
          scheme: http
          serversTransport: skip-ssl
  tls: {}
