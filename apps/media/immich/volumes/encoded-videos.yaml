apiVersion: v1
kind: PersistentVolume
metadata:
  name: encoded-videos-immich-nfs
spec:
  capacity:
    storage: 1070Gi
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  mountOptions:
    - hard
    - nfsvers=4.2
    - rsize=1048576
    - wsize=1048576
    - noatime
  nfs:
    server: 192.168.31.99
    path: "/mnt/vdev14tb/data/pics/immich-encoded-videos"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: encoded-videos-immich-nfs
  namespace: immich
spec:
  volumeName: encoded-videos-immich-nfs
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      # minimum capacity
      storage: 100Mi
