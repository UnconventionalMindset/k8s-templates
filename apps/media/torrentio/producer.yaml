apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: torrentio
  labels:
    app: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: gabisonfire/knightcrawler-producer:latest
          env:
            - name: REDIS_HOST
              value: ":ciao@redis-master.db.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: POSTGRES_HOST
              value: "postgres.db.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "jac"
            - name: POSTGRES_PASSWORD
              value: "JG1@postgres"
            - name: POSTGRES_DB
              value: "knightcrawler"
            - name: NODE_ENV
              value: "production"
            - name: RABBITMQ_URI
              value: "amqp://knightcrawler:knightcrawler@rabbitmq.torrentio.svc.cluster.local:5672"
            - name: RABBITMQ_USER
              value: "knightcrawler"
            - name: RABBITMQ_PASSWORD
              value: "knightcrawler"
            - name: RABBITMQ_HOST
              value: "rabbitmq.torrentio.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
