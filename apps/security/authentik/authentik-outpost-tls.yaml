---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-outpost-tls
  namespace: auth
spec:
  secretName: authentik-outpost-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "auth.umhomelab.com"
  dnsNames:
    - "www.auth.umhomelab.com"
    - "auth.umhomelab.com"
