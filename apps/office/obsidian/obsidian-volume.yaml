apiVersion: v1
kind: PersistentVolume
metadata:
  name: obsidian-app-nfs
  labels:
    app: obsidian
spec:
  capacity:
    storage: 1070Gi
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  mountOptions:
    - hard
    - nfsvers=4.2
    - rsize=1048576
    - wsize=1048576
    - noatime
  nfs:
    server: 192.168.31.99
    path: "/mnt/ssd120/apps/obsidian"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-app-nfs
  namespace: office
spec:
  volumeName: obsidian-app-nfs
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      # minimum capacity
      storage: 100Mi
  selector:
    matchLabels:
      app: obsidian