# Add memory limits to Authentik worker
#
# To apply:
#   kubectl patch deployment authentik-worker -n auth --patch-file 04-authentik-worker-resources.yaml

spec:
  template:
    spec:
      containers:
      - name: worker
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
